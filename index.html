<style>
  :root {

    --card: #ffffff;
    --line: #dcd7f0;
  }
  @media (prefers-color-scheme: dark) {

      --bg: #16141f;
      --ink: #f1eefc;
      --muted: #a6a1bd;
      --card: #211e2f;
      --line: #383450;
    }

  * { box-sizing: border-box; }
  body {
    margin: 0;

  }

    max-width: 640px;

    line-height: 1.1;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
  }
  p.sub { margin: 0 0 32px; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  a.materia {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 10px solid var(--c);
    border-radius: 10px;
    color: inherit;
    text-decoration: none;
    font-size: 1.15rem;
    font-weight: 700;
  }
  a.materia span { display: block; font-size: .9rem; font-weight: 400; color: var(--muted); }
  a.materia:hover { border-color: var(--c); }
  a.materia:focus-visible { outline: 3px solid var(--c); outline-offset: 2px; }
